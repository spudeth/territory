<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14181f">
  <title>Territory</title>
  <link rel="icon" href="tiles/tile_0002.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="map"></canvas>

  <div class="card" id="me">
    <span class="swatch" id="me-color"></span>
    <div>
      <div id="me-name">Connecting…</div>
      <div class="sub"><b id="me-count">0</b> blocks</div>
    </div>
  </div>

  <div class="card" id="board">
    <div class="title">Leaderboard</div>
    <ol id="board-list"></ol>
  </div>

  <div id="hint">Tap any empty block 3× to claim your first block</div>
  <div id="toast"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
